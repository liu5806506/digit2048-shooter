<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:," />
<title>2048 Shooter: Number Match — 复刻版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #game { display: block; touch-action: none; }

  /* ---------- 隐私政策浮层（合规：首启征求同意 / 暂停面板内查阅）---------- */
  .policy-mask {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.72);
    touch-action: none;
  }
  .policy-panel {
    display: flex; flex-direction: column;
    width: 100%; max-width: 460px; max-height: 90%;
    overflow: hidden;
    background: linear-gradient(180deg, #fff8ec, #ffe9c9);
    border: 4px solid #b57a3c;
    border-radius: 18px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  .policy-title {
    flex: 0 0 auto;
    padding: 14px 0 10px;
    text-align: center;
    font-size: 19px; font-weight: 700; color: #8a4f18;
  }
  .policy-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    -webkit-user-select: text; user-select: text;
    padding: 0 16px 10px;
    font-size: 13px; line-height: 1.65; color: #7a5227;
  }
  .policy-body h3 { margin: 12px 0 4px; font-size: 14px; color: #8a4f18; }
  .policy-body p { margin: 0 0 6px; }
  .policy-actions {
    flex: 0 0 auto;
    display: flex; gap: 10px;
    padding: 12px 16px 16px;
    border-top: 2px solid rgba(181, 122, 60, 0.25);
  }
  .policy-btn {
    flex: 1 1 0; height: 46px;
    border: none; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #fff;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .policy-btn-deny { background: #b9a894; }
  .policy-btn-agree { background: #e0803a; }
  .policy-btn:active { filter: brightness(0.92); }
  .policy-exit {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
    background: #000; color: #cfc7f5;
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.7;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script src="src/conf.js"></script>
<script src="src/util.js"></script>
<script src="src/atlas.js"></script>
<script src="src/theme.js"></script>
<script src="src/audio.js"></script>
<script src="src/storage.js"></script>
<script src="src/compliance.js"></script>
<script src="src/user.js"></script>
<script src="src/model.js"></script>
<script src="src/fx.js"></script>
<script src="src/view.js"></script>
<script src="src/hud.js"></script>
<script src="src/popup.js"></script>
<script src="src/main.js"></script>
</body>
</html>
